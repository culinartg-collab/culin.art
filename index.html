<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Culin.Art — Restaurant Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  /* From the Culin.Art website */
  --bg-page: #000000;
  --bg-card: #1A1410;
  --bg-card-hover: #221A14;
  --bg-deep: #0E0907;
  --text-cream: #F5EDE0;
  --text-mute: #8A7E6E;
  --text-faint: #5C534A;
  --gold-hero: #D4A93C;
  --gold-bright: #E5B83A;
  --gold-dusty: #A89878;
  --line-dark: #2A2018;
  --line-soft: #1F1812;

  /* Light mode for forms */
  --form-bg: #F5EDE0;
  --form-card: #FBF6EC;
  --form-line: #E0D5C0;
  --form-line-soft: #ECE2D0;
  --form-deep: #E8DBC1;
  --form-text: #1A1410;
  --form-text-mute: #6E5F4A;

  /* Status */
  --good: #6B8F5C;
  --good-bg: #2A3825;
  --warn: #C77B33;
  --warn-bg: #3A2818;
  --bad: #C45B4F;
  --bad-bg: #3A1F1A;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { background: var(--bg-page); color: var(--text-cream); font-family: 'Inter', sans-serif; font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }

#root { min-height: 100vh; }

/* Loading state */
#loading {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  min-height: 100vh;
  gap: 16px;
}
#loading .brand-mark {
  font-family: 'Fraunces', serif;
  font-size: 2.5rem;
  font-weight: 400;
  letter-spacing: -0.02em;
  color: var(--text-cream);
}
#loading .brand-mark span { color: var(--gold-hero); }
#loading .tagline {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.22em;
  color: var(--gold-hero);
  font-weight: 600;
}
#loading .spinner {
  width: 32px;
  height: 32px;
  border: 3px solid var(--line-dark);
  border-top-color: var(--gold-hero);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-top: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

#error-fallback {
  display: none;
  max-width: 600px;
  margin: 60px auto;
  padding: 30px;
  background: var(--bg-card);
  border: 1px solid var(--bad);
  border-radius: 8px;
  color: var(--text-cream);
}
#error-fallback h2 { color: var(--bad); margin-bottom: 12px; font-family: 'Fraunces', serif; }

/* Typography */
.serif { font-family: 'Fraunces', serif; font-optical-sizing: auto; }
h1, h2, h3 { font-family: 'Fraunces', serif; font-weight: 500; letter-spacing: -0.01em; color: var(--text-cream); }
h1 { font-size: 2.4rem; font-weight: 400; letter-spacing: -0.02em; }
h2 { font-size: 1.6rem; font-weight: 500; }
h3 { font-size: 1.15rem; font-weight: 500; }
.eyebrow { font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 0.2em; font-size: 0.7rem; font-weight: 600; color: var(--gold-hero); }
.muted { color: var(--text-mute); }
.faint { color: var(--text-faint); }
.tabular { font-variant-numeric: tabular-nums; }

/* App shell */
.app-shell { display: flex; min-height: 100vh; background: var(--bg-page); }
.sidebar { width: 240px; background: var(--bg-deep); border-right: 1px solid var(--line-dark); padding: 28px 22px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.brand { font-family: 'Fraunces', serif; font-size: 1.5rem; font-weight: 500; letter-spacing: -0.01em; margin-bottom: 4px; color: var(--text-cream); }
.brand-sub { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.22em; color: var(--gold-hero); margin-bottom: 32px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 6px; margin-bottom: 2px; cursor: pointer; font-size: 0.92rem; color: var(--text-mute); transition: all 0.15s ease; border: none; background: transparent; width: 100%; text-align: left; font-family: inherit; }
.nav-item:hover { background: var(--bg-card); color: var(--text-cream); }
.nav-item.active { background: var(--bg-card); color: var(--gold-hero); }
.nav-item .icon { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.85; font-size: 1.05rem; }
.sidebar-footer { margin-top: auto; padding-top: 20px; border-top: 1px solid var(--line-dark); font-size: 0.78rem; color: var(--text-faint); }

/* Main */
.main { flex: 1; padding: 36px 44px 60px; max-width: 1320px; }
.page-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 28px; padding-bottom: 18px; border-bottom: 1px solid var(--line-dark); }

/* Cards */
.card { background: var(--bg-card); border: 1px solid var(--line-dark); border-radius: 10px; padding: 24px; margin-bottom: 18px; }
.card-title { font-family: 'Fraunces', serif; font-size: 1.05rem; font-weight: 500; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line-dark); display: flex; justify-content: space-between; align-items: center; color: var(--text-cream); }
.card-title .subtitle { font-family: 'Inter'; font-size: 0.82rem; font-weight: 400; color: var(--text-mute); }

/* Light cards (for forms) */
.card-light { background: var(--form-card); border: 1px solid var(--form-line); border-radius: 10px; padding: 24px; margin-bottom: 18px; color: var(--form-text); }
.card-light .card-title { border-bottom-color: var(--form-line-soft); color: var(--form-text); }
.card-light .card-title .subtitle { color: var(--form-text-mute); }

/* KPI grid */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(195px, 1fr)); gap: 14px; margin-bottom: 22px; }
.kpi { background: var(--bg-card); border: 1px solid var(--line-dark); border-radius: 10px; padding: 20px 22px; position: relative; overflow: hidden; }
.kpi.featured { background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-deep) 100%); border-color: var(--gold-hero); }
.kpi.featured .kpi-label { color: var(--gold-hero); }
.kpi-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.18em; color: var(--text-mute); font-weight: 600; margin-bottom: 8px; }
.kpi-value { font-family: 'Fraunces', serif; font-size: 1.85rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1; margin-bottom: 6px; color: var(--text-cream); }
.kpi-value.gold { color: var(--gold-hero); }
.kpi-meta { font-size: 0.78rem; color: var(--text-mute); }
.kpi-status { position: absolute; top: 16px; right: 16px; width: 8px; height: 8px; border-radius: 50%; }
.kpi-status.good { background: var(--good); }
.kpi-status.warn { background: var(--warn); }
.kpi-status.bad { background: var(--bad); }

/* Forms — LIGHT background */
.form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.form-row label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--form-text-mute); font-weight: 600; }
.form-row .label-with-help { display: flex; align-items: center; gap: 6px; }
.form-row .help-icon { width: 14px; height: 14px; border-radius: 50%; background: var(--form-line); color: var(--form-text-mute); font-size: 9px; display: inline-flex; align-items: center; justify-content: center; cursor: help; font-style: italic; font-weight: bold; font-family: serif; position: relative; }
.form-row .help-icon:hover .help-tip { display: block; }
.help-tip { display: none; position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: var(--bg-card); color: var(--text-cream); padding: 8px 12px; border-radius: 6px; font-size: 0.78rem; font-style: normal; font-weight: 400; line-height: 1.45; width: 240px; box-shadow: 0 8px 24px -8px rgba(0,0,0,0.5); z-index: 100; text-transform: none; letter-spacing: normal; border: 1px solid var(--line-dark); pointer-events: none; }
.help-tip::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 5px solid transparent; border-top-color: var(--bg-card); }
.form-row input, .form-row select, .form-row textarea { font-family: 'Inter', sans-serif; padding: 10px 12px; border: 1px solid var(--form-line); border-radius: 6px; background: white; font-size: 0.95rem; color: var(--form-text); transition: border-color 0.15s, box-shadow 0.15s; width: 100%; }
.form-row input:focus, .form-row select:focus, .form-row textarea:focus { outline: none; border-color: var(--gold-hero); box-shadow: 0 0 0 3px rgba(212, 169, 60, 0.15); }
.form-row .hint { font-size: 0.78rem; color: var(--form-text-mute); font-style: italic; }
.form-row .input-suffix { position: relative; }
.form-row .input-suffix .suffix { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--form-text-mute); font-size: 0.85rem; pointer-events: none; }
.form-row .input-suffix input { padding-right: 32px; }
.form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }

/* Buttons */
.btn { font-family: 'Inter', sans-serif; padding: 11px 20px; border-radius: 6px; font-size: 0.92rem; font-weight: 500; cursor: pointer; transition: all 0.15s ease; border: 1px solid transparent; display: inline-flex; align-items: center; gap: 8px; }
.btn-primary { background: var(--gold-hero); color: var(--bg-page); }
.btn-primary:hover { background: var(--gold-bright); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-ghost { background: transparent; border-color: var(--form-line); color: var(--form-text); }
.btn-ghost:hover { background: var(--form-deep); }
.btn-ghost-dark { background: transparent; border-color: var(--line-dark); color: var(--text-cream); }
.btn-ghost-dark:hover { background: var(--bg-card-hover); }
.btn-gold { background: var(--gold-hero); color: var(--bg-page); }
.btn-gold:hover { background: var(--gold-bright); }
.btn-danger { background: transparent; color: var(--bad); border-color: transparent; }
.btn-danger:hover { background: var(--bad-bg); }
.btn-sm { padding: 7px 13px; font-size: 0.82rem; }

/* Tables — LIGHT for forms */
table.data { width: 100%; border-collapse: collapse; font-size: 0.92rem; color: var(--form-text); }
table.data th { text-align: left; padding: 10px 12px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--form-text-mute); font-weight: 600; border-bottom: 1px solid var(--form-line); background: var(--form-deep); }
table.data td { padding: 10px 12px; border-bottom: 1px solid var(--form-line-soft); }
table.data tr:hover td { background: var(--form-deep); }
table.data input { width: 100%; border: 1px solid transparent; background: transparent; padding: 4px 6px; border-radius: 4px; font: inherit; color: inherit; }
table.data input:hover { border-color: var(--form-line); background: white; }
table.data input:focus { border-color: var(--gold-hero); background: white; outline: none; }
table.data select { border: 1px solid transparent; background: transparent; padding: 4px 6px; border-radius: 4px; font: inherit; color: inherit; }
table.data select:hover { border-color: var(--form-line); background: white; }
table.data select:focus { outline: none; border-color: var(--gold-hero); background: white; }
table.data .num { text-align: right; font-variant-numeric: tabular-nums; }
table.data tfoot td { font-weight: 600; background: var(--form-deep); border-top: 2px solid var(--form-text); border-bottom: none; }

/* Wizard */
.wizard-shell { min-height: 100vh; background: radial-gradient(ellipse at top, #1A1410 0%, #000000 60%); display: flex; align-items: center; justify-content: center; padding: 30px 20px; }
.wizard-card { width: 100%; max-width: 660px; background: var(--form-card); border: 1px solid var(--form-line); border-radius: 12px; padding: 50px 52px; box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.6); color: var(--form-text); }
.wizard-progress { display: flex; gap: 6px; margin-bottom: 32px; }
.wizard-progress .dot { flex: 1; height: 3px; border-radius: 2px; background: var(--form-line); transition: background 0.3s; }
.wizard-progress .dot.active { background: var(--gold-hero); }
.wizard-progress .dot.done { background: var(--gold-dusty); }
.wizard-eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.22em; color: var(--gold-hero); font-weight: 600; margin-bottom: 12px; }
.wizard-title { font-family: 'Fraunces', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; margin-bottom: 10px; line-height: 1.15; color: var(--form-text); }
.wizard-subtitle { color: var(--form-text-mute); margin-bottom: 32px; font-size: 1rem; line-height: 1.5; }
.wizard-actions { display: flex; justify-content: space-between; margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--form-line); }

/* Lang toggle */
.lang-toggle { display: inline-flex; border: 1px solid var(--form-line); border-radius: 6px; overflow: hidden; }
.lang-toggle button { padding: 5px 12px; background: transparent; border: none; cursor: pointer; font: inherit; font-size: 0.78rem; font-weight: 500; color: var(--form-text-mute); }
.lang-toggle button.active { background: var(--gold-hero); color: var(--bg-page); }
.sidebar .lang-toggle { border-color: var(--line-dark); }
.sidebar .lang-toggle button { color: var(--text-mute); }
.sidebar .lang-toggle button.active { background: var(--gold-hero); color: var(--bg-page); }

/* Topbar */
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; gap: 16px; }
.week-selector { display: flex; align-items: center; gap: 8px; background: var(--bg-card); border: 1px solid var(--line-dark); border-radius: 6px; padding: 6px 10px; color: var(--text-cream); }
.week-selector button { background: transparent; border: none; cursor: pointer; padding: 4px 8px; border-radius: 4px; color: var(--text-mute); font: inherit; font-size: 1.1rem; }
.week-selector button:hover:not(:disabled) { background: var(--bg-card-hover); color: var(--text-cream); }
.week-selector button:disabled { opacity: 0.3; cursor: not-allowed; }

/* Empty state */
.empty { text-align: center; padding: 50px 20px; color: var(--text-mute); }
.empty-illu { font-family: 'Fraunces', serif; font-size: 3rem; color: var(--gold-hero); margin-bottom: 12px; }

/* Toast */
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--gold-hero); color: var(--bg-page); padding: 12px 18px; border-radius: 6px; font-size: 0.88rem; font-weight: 600; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.6); z-index: 1000; animation: slideIn 0.25s ease; }
@keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.section-row { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--form-line-soft); border-radius: 6px; margin-bottom: 8px; background: white; }
.color-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

.table-wrap { overflow-x: auto; border: 1px solid var(--form-line); border-radius: 8px; }
.table-wrap table { min-width: 100%; }

/* Cost breakdown collapsible */
.cost-row { padding: 12px 0; border-bottom: 1px solid var(--line-dark); }
.cost-row:last-child { border-bottom: none; }
.cost-row-head { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
.cost-row-head .left { display: flex; align-items: center; gap: 10px; }
.cost-row-head .chev { width: 10px; height: 10px; border-right: 2px solid var(--text-mute); border-bottom: 2px solid var(--text-mute); transform: rotate(-45deg); transition: transform 0.2s; }
.cost-row-head.open .chev { transform: rotate(45deg); }
.cost-row-head .dot { width: 10px; height: 10px; border-radius: 2px; }
.cost-row-body { margin-top: 10px; padding-left: 24px; display: none; }
.cost-row-body.open { display: block; }
.cost-row-body .sub { display: flex; justify-content: space-between; padding: 6px 0; font-size: 0.88rem; color: var(--text-mute); border-top: 1px solid var(--line-soft); }
.cost-row-body .sub:first-child { border-top: none; }
.cost-row .bar-track { height: 6px; background: var(--bg-deep); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.cost-row .bar-fill { height: 100%; transition: width 0.4s ease; }

/* Section bars */
.bar-h { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.bar-h .bar-label { width: 110px; font-size: 0.85rem; flex-shrink: 0; color: var(--text-cream); }
.bar-h .bar-track { flex: 1; height: 22px; background: var(--bg-deep); border-radius: 4px; overflow: hidden; position: relative; }
.bar-h .bar-fill { height: 100%; transition: width 0.4s ease; }
.bar-h .bar-value { width: 130px; text-align: right; font-size: 0.85rem; font-variant-numeric: tabular-nums; flex-shrink: 0; color: var(--text-mute); }

/* Status pill */
.status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 100px; font-size: 0.75rem; font-weight: 600; }
.status-pill.good { background: var(--good-bg); color: var(--good); }
.status-pill.warn { background: var(--warn-bg); color: var(--warn); }
.status-pill.bad { background: var(--bad-bg); color: var(--bad); }

/* Number with sub */
.num-stack { display: flex; flex-direction: column; align-items: flex-end; }
.num-stack .primary { font-variant-numeric: tabular-nums; }
.num-stack .secondary { font-size: 0.78rem; color: var(--text-mute); margin-top: 2px; }

/* Mobile */
@media (max-width: 900px) {
  .app-shell { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: relative; flex-direction: row; padding: 16px; flex-wrap: wrap; }
  .brand { margin: 0; }
  .brand-sub { display: none; }
  .nav-item { width: auto; flex: 0 0 auto; padding: 8px 12px; }
  .sidebar-footer { display: none; }
  .main { padding: 24px 18px; }
  .form-grid-2, .form-grid-3 { grid-template-columns: 1fr; }
  .wizard-card { padding: 30px 24px; }
}
</style>
</head>
<body>

<div id="root">
  <div id="loading">
    <div class="tagline">Culin.Art</div>
    <div class="brand-mark">Restaurant <span>Intelligence</span></div>
    <div class="spinner"></div>
    <div style="font-size: 0.85rem; color: var(--text-mute); margin-top: 12px;">Loading platform…</div>
  </div>
</div>

<div id="error-fallback">
  <h2>Loading failed</h2>
  <p style="margin-bottom: 12px;">The platform's libraries did not load. Save the file (right-click → Save As) and open it in Chrome, Firefox, or Safari directly.</p>
  <p id="error-detail" style="font-family: monospace; font-size: 0.85rem; color: var(--text-mute); margin-top: 12px;"></p>
</div>

<noscript>
  <div style="padding: 40px; text-align: center; color: #F5EDE0;">
    <h2>JavaScript required</h2>
    <p>Please enable JavaScript to use Culin.Art.</p>
  </div>
</noscript>

  onerror="document.getElementById('loading').style.display='none';document.getElementById('error-fallback').style.display='block';document.getElementById('error-detail').textContent='ReactDOM failed to load';"></script>

    CRC: {
      symbol: '₡',
      code: 'CRC',
      name: 'Colón Costarricense (CRC)',
      decimals: 0,
      locale: 'es-CR'
    },
    USD: {

      decimals: 2,

    },
    EUR: {
      symbol: '€',

    }
  };

  // FULL currency: never shortened. Show real numbers everywhere.
  const fmtCurrency = (val, currency) => {
    const c = CURRENCIES[currency] || CURRENCIES.CRC;
    if (val === null || val === undefined || isNaN(val)) return c.symbol + '0';
    const n = Math.round(val * Math.pow(10, c.decimals)) / Math.pow(10, c.decimals);
    return c.symbol + n.toLocaleString(c.locale, {
      minimumFractionDigits: c.decimals,
      maximumFractionDigits: c.decimals
    });
  };
  const fmtPct = (val, decimals = 1) => {
    if (val === null || val === undefined || isNaN(val)) return '—';
    return (val * 100).toFixed(decimals) + '%';
  };
  // Short version ONLY for chart axes (where space is tight)
  const fmtCurrencyShort = (val, currency) => {
    const c = CURRENCIES[currency] || CURRENCIES.CRC;
    if (val === null || val === undefined || isNaN(val)) return c.symbol + '0';
    if (Math.abs(val) >= 1e6) return c.symbol + (val / 1e6).toFixed(1) + 'M';
    if (Math.abs(val) >= 1e3) return c.symbol + (val / 1e3).toFixed(1) + 'K';
    return c.symbol + val.toFixed(0);
  };

    // All levers are % adjustments (percentage points delta from base)
    // salesDelta: % change in revenue  e.g. +10 = 10% more sales

    const sym = { CRC: '₡', USD: '$', EUR: '€', MXN: '$' }[c] || '₡';
